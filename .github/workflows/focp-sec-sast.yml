name: FOCP Security Scanner

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  focp-sec-scan:
    name: Run FOCP Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install FOCP Sec Scanner
        run: |
          pip install -r requirements.txt
          pip install .

      - name: Run Scan
        run: |
          # Generate SARIF report for GitHub Advanced Security
          mkdir -p ./reports
          focp-sec scan . --format sarif --output ./reports
        continue-on-error: true

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ./reports/*.sarif
          if-no-files-found: warn
          category: my-focp-sec-analysis
