name: FOCP Security Scanner

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  focp-sec-scan:
    name: Run FOCP Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FOCP Sec Scanner
        run: |
          pip install -r requirements.txt
          pip install .

      - name: Run Scan
        run: |
          # Generate SARIF report for GitHub Advanced Security
          focp-sec scan . --format sarif --output-dir ./reports
        continue-on-error: true

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./reports/
          category: my-focp-sec-analysis
