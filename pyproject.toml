[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "focp-sec"
version = "1.0.0"
description = "FOCP Secure SDLC Assistant - Security analysis for software projects"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
authors = [
    {name = "FOCP Security Team", email = "security@focp.dev"}
]
keywords = ["security", "sdlc", "owasp", "sast", "devsecops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "PySide6>=6.6.0",
    "rich>=13.7.0",
    "typer[all]>=0.12.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-php>=0.23.0",
    "bandit>=1.7.0",
    "GitPython>=3.1.40",
    "reportlab>=4.1.0",
    "Jinja2>=3.1.0",
    "Markdown>=3.5.0",
    "PyYAML>=6.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "pyinstaller>=6.5.0",
]

[project.scripts]
focp-sec = "focp_sec.cli.main:app"

[project.gui-scripts]
focp-sec-gui = "focp_sec.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
focp_sec = [
    "templates/**/*",
    "rules/**/*",
    "data/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
